# yaml-language-server: $schema=https://cloud.nx.app/nx-cloud/static/schemas/workflow.schema.json
#
# Nx Cloud CI pipeline. Nx Cloud runs this file on every push to main and every
# pull request; there is no GitHub Actions workflow. The status check on GitHub
# is named "Nx Cloud: CI".
name: CI

on:
  main-pushes:
    event: PUSH
    branches: [main]
  pull-requests:
    event: PR

# Applies to the main job and to every worker.
env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_TUI: 'false'

launch-templates:
  # Node image plus Java from mise.toml, with caches for the pnpm store and
  # Gradle. The main job runs on it as well as the workers: @nx/gradle asks
  # Gradle for the project graph before anything is distributed, so every
  # machine needs Java.
  linux-medium-polyglot:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node24.14-v1'
    init-steps:
      - name: Checkout
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/checkout/main.yaml'

      - name: Restore pnpm cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'pnpm-lock.yaml'
          paths: '~/.local/share/pnpm/store'
          base-branch: 'main'

      # Dependencies and compiled build scripts. Warm, this takes the first
      # project graph from ~45s to ~10s. ~/.gradle/wrapper is left out on
      # purpose: restoring the Gradle distribution from the cache (~5s) is
      # slower than "Warm up Gradle" downloading it (~3.7s).
      - name: Restore Gradle cache
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/cache/main.yaml'
        inputs:
          key: 'gradle/wrapper/gradle-wrapper.properties|**/gradle.lockfile|**/*.gradle.kts|gradle.properties'
          paths: '~/.gradle/caches'
          base-branch: 'main'

      # Installs the Java version pinned in mise.toml.
      - name: Install Java with mise
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-mise/main.yaml'

      - name: Install dependencies
        uses: 'nrwl/nx-cloud-workflows/v6/workflow-steps/install-node-modules/main.yaml'

      # Playwright browsers are not cached on purpose: restoring them from the
      # cache (~10s) took as long as downloading them.
      #
      # The Playwright install (mostly apt) and the first project graph
      # (Gradle startup, ~10s warm, ~45s cold) don't depend on each other, so
      # they run side by side. Nx stores the graph in .nx/workspace-data, and
      # the later nx commands reuse it.
      - group-name: Prepare toolchains
        parallel: true
        steps:
          # Browser for the storefront-e2e Playwright specs. --with-deps adds
          # any missing system libraries through apt. --only-shell installs
          # just the headless shell, which is all headless Chromium needs; the
          # full Chrome build is skipped. Drop it if a project runs headed or
          # with channel: 'chrome'.
          - name: Install Playwright Chromium
            script: pnpm exec playwright install --with-deps --only-shell chromium

          # Downloads the Gradle distribution and computes the project graph.
          - name: Compute project graph
            script: |
              ./gradlew --version
              pnpm exec nx show projects > /dev/null

      - name: Verify toolchains
        script: |
          node --version
          pnpm --version
          java -version

worker-templates:
  default:
    workers: 3 linux-medium-polyglot
    stop-after:
      - build
      - typecheck
      - test
      - e2e-ci

jobs:
  main:
    name: Nx checks
    runs-on: linux-medium-polyglot
    workers: default
    steps:
      - name: Check workspace sync
        run: pnpm exec nx sync:check

      - name: Check formatting
        run: pnpm exec nx format:check

      - name: Run Nx tasks
        run: pnpm exec nx affected -t build typecheck test e2e-ci
